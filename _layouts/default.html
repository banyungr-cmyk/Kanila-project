<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} | KANILA</title>
    <style>
        :root {
            --bg-paper: #FDFCF8;
            --text-dark: #2C2C2C;
            --accent-purple: #745E8D;
            --accent-pink: #A65D6A;
            --border: #E0DED7;
        }
        body {
            font-family: 'Georgia', serif;
            background-color: var(--bg-paper);
            color: var(--text-dark);
            margin: 0; padding: 0;
            line-height: 1.8;
            font-size: 1.1rem;
        }
        header { padding: 40px 20px; text-align: center; border-bottom: 1px solid var(--border); }
        .logo { font-size: 2.5rem; letter-spacing: 0.2em; text-decoration: none; color: var(--text-dark); text-transform: uppercase; }
        nav { margin-top: 20px; }
        nav a { text-decoration: none; color: var(--text-dark); margin: 0 15px; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 2px; }
        main { max-width: 1100px; margin: 40px auto; padding: 0 20px; }
        footer { text-align: center; padding: 60px 20px; border-top: 1px solid var(--border); margin-top: 40px; font-size: 0.9rem; color: #666; }
    </style>
</head>
<body>

    <header role="banner">
        <a href="/" class="logo">KANILA</a>
        <nav role="navigation">
            <a href="/">Beranda</a>
            <a href="/about.html">Tentang</a>
            <a href="/kontak.html">Kontak</a>
        </nav>
    </header>

    <main id="content">
        {{ content }}
    </main>

    <footer>
        <p>Lakukan semua dengan hati, maka akan sampai juga pada hati.</p>
        <p>&copy; 2026 Banyu Kanila🪷</p>
    </footer>

</body>
</html>
