<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} | KANILA</title>
    <style>
        :root {
            --bg-paper: #FDFCF8;
            --text-dark: #2C2C2C;
            --accent-purple: #745E8D;
            --accent-pink: #A65D6A;
            --border: #E0DED7;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-paper: #1A1A1A;
                --text-dark: #E0E0E0;
                --accent-purple: #A294B5;
                --accent-pink: #D4A5AF;
                --border: #333333;
            }
        }

        /* 1. ANIMASI KERTAS DAN TRANSISI */
        body {
            font-family: 'Georgia', serif;
            background-color: var(--bg-paper);
            background-image: url('https://www.transparenttextures.com/patterns/cream-paper.png');
            color: var(--text-dark);
            line-height: 1.8;
            margin: 0; padding: 0;
            opacity: 0; /* Untuk animasi fade-in */
            animation: paperOpen 1.2s forwards ease-out;
        }

        @keyframes paperOpen {
            0% { opacity: 0; transform: scale(0.98) rotate(-1deg); }
            100% { opacity: 1; transform: scale(1) rotate(0deg); }
        }

        /* 2. SKIP TO CONTENT (Sangat Penting untuk Aksesibilitas) */
        .skip-link {
            position: absolute;
            top: -100px; left: 10px;
            background: var(--accent-purple);
            color: white;
            padding: 10px 20px;
            z-index: 9999;
            text-decoration: none;
            border-radius: 5px;
        }
        .skip-link:focus { top: 10px; }

        header { padding: 40px 20px; text-align: center; border-bottom: 1px solid var(--border); }
        .logo { font-size: 2.2rem; letter-spacing: 0.2em; text-decoration: none; color: var(--text-dark); text-transform: uppercase; font-weight: bold; }
        
        main { max-width: 800px; margin: 60px auto; padding: 0 25px; min-height: 60vh; }
        .post-content { text-align: justify; }

        .post-tools { display: flex; gap: 15px; margin-bottom: 30px; border-bottom: 1px dashed var(--border); padding-bottom: 15px; }
        .tool-btn { background: none; border: 1px solid var(--accent-purple); color: var(--accent-purple); padding: 8px 18px; border-radius: 20px; cursor: pointer; font-size: 0.9rem; }
        .tool-btn:hover { background: var(--accent-purple); color: white; }

        footer { text-align: center; padding: 60px 20px; border-top: 1px solid var(--border); margin-top: 80px; font-size: 0.9rem; color: #888; }
    </style>
</head>
<body>

    <a href="#main-content" class="skip-link">Lonceng ke Konten Utama</a>

    <audio id="paperSound" preload="auto">
        <source src="https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3" type="audio/mpeg">
    </audio>

    <header role="banner">
        <a href="/" class="logo">KANILA</a>
        <nav role="navigation" aria-label="Menu Utama">
            <a href="/" style="margin: 0 15px; text-decoration: none; color: inherit;">Beranda</a>
            <a href="/about.html" style="margin: 0 15px; text-decoration: none; color: inherit;">Tentang</a>
        </nav>
    </header>

    <main id="main-content" role="main" tabindex="-1">
        <article>
            <h1>{{ page.title }}</h1>
            
            <div class="post-tools">
                <button class="tool-btn" onclick="speakContent()" aria-label="Dengarkan isi tulisan">🔊 Dengarkan</button>
                <button class="tool-btn" onclick="sharePage()" aria-label="Bagikan tulisan ini">🔗 Bagikan</button>
            </div>

            <div id="contentToRead" class="post-content">
                {{ content }}
            </div>
        </article>
    </main>

    <script>
        // Efek Suara Kertas saat Halaman Terbuka
        window.addEventListener('DOMContentLoaded', () => {
            const paperAudio = document.getElementById('paperSound');
            // Browser sering memblokir audio otomatis, jadi kita picu saat interaksi pertama atau load jika diizinkan
            paperAudio.play().catch(() => { console.log("Audio otomatis tertahan browser"); });
        });

        function speakContent() {
            const text = document.getElementById('contentToRead').innerText;
            const synth = window.speechSynthesis;
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'id-ID';
            synth.speak(utterance);
        }

        function sharePage() {
            if (navigator.share) {
                navigator.share({ title: '{{ page.title }}', url: window.location.href });
            } else {
                alert('Tautan disalin: ' + window.location.href);
            }
        }
    </script>

    <footer role="contentinfo">
        <p>"Lakukan semua dengan hati, maka akan sampai juga pada hati."</p>
    </footer>

</body>
</html>
